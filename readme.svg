<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 200"
     width="100%"
     height="200"
     align="center">

  <defs>
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <filter id="softGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- هاله‌ی اصلی -->
  <g fill="#ffffff"
     opacity="0.9"
     filter="url(#glow)">

    <rect x="90" y="20" width="20" height="20"/>
    <rect x="70" y="40" width="40" height="20"/>
    <rect x="50" y="60" width="60" height="20"/>

    <!-- بازوی افقی با پله‌ی سمت چپ -->
    <rect x="50" y="80" width="120" height="20"/>
    <rect x="30" y="100" width="120" height="20"/>

    <rect x="70" y="120" width="60" height="20"/>
    <rect x="70" y="140" width="40" height="20"/>
    <rect x="70" y="160" width="20" height="20"/>
  </g>

  <!-- هاله‌ی نزدیک -->
  <g fill="#ffffff"
     opacity="0.75"
     filter="url(#softGlow)">

    <rect x="90" y="20" width="20" height="20"/>
    <rect x="70" y="40" width="40" height="20"/>
    <rect x="50" y="60" width="60" height="20"/>

    <!-- بازوی افقی با پله‌ی سمت چپ -->
    <rect x="50" y="80" width="120" height="20"/>
    <rect x="30" y="100" width="120" height="20"/>

    <rect x="70" y="120" width="60" height="20"/>
    <rect x="70" y="140" width="40" height="20"/>
    <rect x="70" y="160" width="20" height="20"/>
  </g>

  <!-- خود لوگو -->
  <g fill="#ffffff">

    <rect x="90" y="20" width="20" height="20"/>
    <rect x="70" y="40" width="40" height="20"/>
    <rect x="50" y="60" width="60" height="20"/>

    <!-- بازوی افقی با پله‌ی سمت چپ -->
    <rect x="50" y="80" width="120" height="20"/>
    <rect x="30" y="100" width="120" height="20"/>

    <rect x="70" y="120" width="60" height="20"/>
    <rect x="70" y="140" width="40" height="20"/>
    <rect x="70" y="160" width="20" height="20"/>
  </g>

</svg>
