<svg xmlns="http://www.w3.org/2000/svg"
     width="900"
     height="360"
     viewBox="0 0 900 360">

  <defs>
    <!-- GitHub Accent Glow -->
    <filter id="logoGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>


  <!-- ========================================================= -->
  <!-- GITHUB CARD CONTAINER (Canvas Base: #0d1117, Border: #30363d) -->
  <!-- ========================================================= -->

  <rect x="0"
        y="0"
        width="900"
        height="360"
        rx="12"
        fill="#0d1117"/>

  <!-- Outer Border (GitHub Primer style) -->
  <rect x="1"
        y="1"
        width="898"
        height="358"
        rx="11"
        fill="none"
        stroke="#30363d"
        stroke-width="1.5"/>


  <!-- ========================================================= -->
  <!-- GITHUB HEADER / NAVBAR (#161b22) -->
  <!-- ========================================================= -->

  <rect x="1"
        y="1"
        width="898"
        height="44"
        rx="11"
        fill="#161b22"/>

  <rect x="1"
        y="25"
        width="898"
        height="20"
        fill="#161b22"/>

  <!-- Divider Line -->
  <line x1="1"
        y1="45"
        x2="899"
        y2="45"
        stroke="#30363d"
        stroke-width="1"/>

  <!-- GitHub Window Controls / Dots -->
  <circle cx="24" cy="23" r="5" fill="#f85149"/>
  <circle cx="40" cy="23" r="5" fill="#e3b341"/>
  <circle cx="56" cy="23" r="5" fill="#2ea043"/>

  <!-- GitHub Tab Style Title -->
  <rect x="350" y="10" width="200" height="26" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  
  <!-- Terminal Icon (SVG Path) -->
  <path d="M362 20 L368 23 L362 26 M370 26 L376 26" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <text x="480"
        y="27"
        text-anchor="middle"
        fill="#f0f6fc"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="12"
        font-weight="600">
    mr / profile-fastfetch
  </text>


  <!-- ========================================================= -->
  <!-- LOGO SECTION (Centered in Left Panel x: 0..270, y: 45..360) -->
  <!-- Scale 1.15x for larger presence, no label underneath -->
  <!-- ========================================================= -->

  <g transform="translate(31.5, 98) scale(1.15)">
    <!-- GitHub Blue Glow -->
    <g fill="#2f81f7" opacity="0.3" filter="url(#logoGlow)">
      <rect x="90" y="20" width="20" height="20"/>
      <rect x="70" y="40" width="40" height="20"/>
      <rect x="50" y="60" width="60" height="20"/>

      <rect x="50" y="80" width="120" height="20"/>
      <rect x="30" y="100" width="120" height="20"/>

      <rect x="70" y="120" width="60" height="20"/>
      <rect x="70" y="140" width="40" height="20"/>
      <rect x="70" y="160" width="20" height="20"/>
    </g>

    <!-- Inner Soft Glow -->
    <g fill="#58a6ff" opacity="0.5" filter="url(#softGlow)">
      <rect x="90" y="20" width="20" height="20"/>
      <rect x="70" y="40" width="40" height="20"/>
      <rect x="50" y="60" width="60" height="20"/>

      <rect x="50" y="80" width="120" height="20"/>
      <rect x="30" y="100" width="120" height="20"/>

      <rect x="70" y="120" width="60" height="20"/>
      <rect x="70" y="140" width="40" height="20"/>
      <rect x="70" y="160" width="20" height="20"/>
    </g>

    <!-- Main Solid Logo (GitHub White/Foreground) -->
    <g fill="#f0f6fc">
      <rect x="90" y="20" width="20" height="20"/>
      <rect x="70" y="40" width="40" height="20"/>
      <rect x="50" y="60" width="60" height="20"/>

      <rect x="50" y="80" width="120" height="20"/>
      <rect x="30" y="100" width="120" height="20"/>

      <rect x="70" y="120" width="60" height="20"/>
      <rect x="70" y="140" width="40" height="20"/>
      <rect x="70" y="160" width="20" height="20"/>
    </g>
  </g>


  <!-- Vertical Divider -->
  <line x1="270"
        y1="65"
        x2="270"
        y2="330"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- ========================================================= -->
  <!-- FASTFETCH CONTENT (GitHub UI Style - Pill Badges & High Contrast Fonts) -->
  <!-- ========================================================= -->

  <!-- Command Line Prompt -->
  <text x="305"
        y="75"
        fill="#3fb950"
        font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace"
        font-size="13"
        font-weight="600">
    mr@github
  </text>

  <text x="385"
        y="75"
        fill="#8b949e"
        font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace"
        font-size="13">
    :~ $
  </text>

  <text x="420"
        y="75"
        fill="#58a6ff"
        font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace"
        font-size="13"
        font-weight="600">
    fastfetch
  </text>


  <!-- User Row -->
  <rect x="305" y="93" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="108" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">user</text>
  <text x="390" y="109" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">MR</text>

  <!-- OS Row -->
  <rect x="305" y="121" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="136" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">os</text>
  <text x="390" y="137" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Fedora Linux 44</text>

  <!-- DE Row -->
  <rect x="305" y="149" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="164" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">de</text>
  <text x="390" y="165" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">KDE Plasma</text>

  <!-- Shell Row -->
  <rect x="305" y="177" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="192" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">shell</text>
  <text x="390" y="193" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Bash</text>

  <!-- CPU Row -->
  <rect x="305" y="205" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="220" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">cpu</text>
  <text x="390" y="221" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Intel Core 2 Quad</text>

  <!-- Memory Row -->
  <rect x="305" y="233" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="248" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">memory</text>
  <text x="390" y="249" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">6 GB</text>


  <!-- GitHub Divider Horizontal Line -->
  <line x1="305"
        y1="268"
        x2="850"
        y2="268"
        stroke="#21262d"
        stroke-width="1"/>


  <!-- Tech Topic Pills (GitHub Topic Badges) -->
  <rect x="305" y="280" width="70" height="22" rx="6" fill="#21262d"/>
  <text x="340" y="295" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">tech</text>

  <!-- GitHub Topic Badges Style -->
  <g transform="translate(385, 278)">
    <!-- Badge 1: Web -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#ddf4ff" opacity="0.1"/>
    <rect x="0" y="0" width="160" height="24" rx="12" fill="none" stroke="#58a6ff" stroke-width="0.8" opacity="0.4"/>
    <text x="80" y="16" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">HTML • CSS • JavaScript</text>

    <!-- Badge 2: Mobile/PWA -->
    <rect x="170" y="0" width="150" height="24" rx="12" fill="#ddf4ff" opacity="0.1"/>
    <rect x="170" y="0" width="150" height="24" rx="12" fill="none" stroke="#58a6ff" stroke-width="0.8" opacity="0.4"/>
    <text x="245" y="16" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500">Kotlin • Android • PWA</text>
  </g>


  <!-- Terminal Active Cursor Bottom -->
  <text x="305" y="333" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace" font-size="13">└─$</text>

  <!-- GitHub Green Blinking Cursor -->
  <rect x="345" y="322" width="7" height="14" rx="1" fill="#3fb950">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>
